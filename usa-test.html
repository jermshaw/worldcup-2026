<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USA Team Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0d0d;
    font-family: 'Inter', sans-serif;
    color: #fff;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    min-height: 100vh;
  }

  .sheet {
    width: 100%;
    max-width: 430px;
    background: #16161a;
    border-radius: 24px 24px 0 0;
    overflow: hidden;
  }

  .header {
    position: relative;
    background: #0A3161;
    padding: 36px 20px 0;
    display: flex;
    flex-direction: column;
    border-radius: 24px 24px 0 0;
  }

  .flag-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    padding-bottom: 20px;
  }

  canvas {
    border-radius: 8px;
    display: block;
  }

  .team-name {
    font-family: 'Dela Gothic One', sans-serif;
    font-size: 25px;
    color: #fff;
    text-align: center;
  }

  .team-sub {
    font-size: 14px;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
    text-align: center;
    margin-top: 4px;
    padding-bottom: 20px;
  }

  .stats-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
  }

  .stat-block { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; }
  .stat-num { font-family: 'Dela Gothic One', sans-serif; font-size: 30px; color: #fff; line-height: 1; }
  .stat-num.dim { color: rgba(255,255,255,0.4); }
  .stat-lbl { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.6); white-space: nowrap; }
  .stat-div { width: 1px; height: 40px; background: rgba(255,255,255,0.2); flex-shrink: 0; }

  .separator { height: 1px; background: rgba(255,255,255,0.1); }

  .body { padding: 20px 20px 40px; display: flex; flex-direction: column; gap: 20px; }
  .date-group { display: flex; flex-direction: column; gap: 10px; }
  .date-label { font-size: 14px; font-weight: 700; }
  .date-primary { color: #fff; }

  .card { position: relative; height: 106px; display: flex; border-radius: 12px; overflow: hidden; }
  .team-side { position: relative; width: 50%; height: 100%; overflow: hidden; }
  .team-flag { position: absolute; font-size: 52px; line-height: 1; top: 12px; left: 14px; }
  .team-side.right .team-flag { left: auto; right: 14px; }
  .team-name-card { position: absolute; bottom: 10px; left: 14px; font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
  .team-side.right .team-name-card { left: auto; right: 14px; }

  .card-overlay {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 106px; height: 71px; background: rgba(22,22,26,0.6);
    backdrop-filter: blur(22px); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; z-index: 2;
  }
  .score { font-family: 'Dela Gothic One', sans-serif; font-size: 22px; color: #fff; }
  .score .dash { color: #717171; }
  .time { font-family: 'Dela Gothic One', sans-serif; font-size: 18px; color: #fff; }
  .group-label { font-size: 10px; color: rgba(255,255,255,0.6); }
</style>
</head>
<body>
<div class="sheet">
  <div class="header">

    <div class="flag-wrap">
      <canvas id="flag" width="210" height="125"></canvas>
    </div>

    <p class="team-name">United States</p>
    <p class="team-sub">Group D &middot; Position 1</p>
    <div class="stats-row">
      <div class="stat-block"><span class="stat-num">3</span><span class="stat-lbl">Points</span></div>
      <div class="stat-div"></div>
      <div class="stat-block"><span class="stat-num">1</span><span class="stat-lbl">Wins</span></div>
      <div class="stat-div"></div>
      <div class="stat-block"><span class="stat-num dim">0</span><span class="stat-lbl">Losses</span></div>
      <div class="stat-div"></div>
      <div class="stat-block"><span class="stat-num dim">0</span><span class="stat-lbl">Draws</span></div>
    </div>
  </div>

  <div class="separator"></div>

  <div class="body">
    <div class="date-group">
      <div class="date-label"><span class="date-primary">Fri, Jun 12</span></div>
      <div class="card">
        <div class="team-side" style="background:#0A3161"><span class="team-flag">🇺🇸</span><span class="team-name-card">USA</span></div>
        <div class="team-side right" style="background:#D52B1E"><span class="team-flag">🇵🇾</span><span class="team-name-card">Paraguay</span></div>
        <div class="card-overlay"><div class="score">4<span class="dash">&nbsp;-&nbsp;</span>1</div><div class="group-label">Group D</div></div>
      </div>
    </div>
    <div class="date-group">
      <div class="date-label"><span class="date-primary">Fri, Jun 19</span></div>
      <div class="card">
        <div class="team-side" style="background:#0A3161"><span class="team-flag">🇺🇸</span><span class="team-name-card">USA</span></div>
        <div class="team-side right" style="background:#00843D"><span class="team-flag">🇦🇺</span><span class="team-name-card">Australia</span></div>
        <div class="card-overlay"><div class="time">12 PM</div><div class="group-label">Group D</div></div>
      </div>
    </div>
    <div class="date-group">
      <div class="date-label"><span class="date-primary">Thu, Jun 25</span></div>
      <div class="card">
        <div class="team-side" style="background:#E30A17"><span class="team-flag">🇹🇷</span><span class="team-name-card">Turkey</span></div>
        <div class="team-side right" style="background:#0A3161"><span class="team-flag">🇺🇸</span><span class="team-name-card">USA</span></div>
        <div class="card-overlay"><div class="time">7 PM</div><div class="group-label">Group D</div></div>
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('flag');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;   // 300
  const H = 111; // flag content height (canvas is taller to give wave room)

  // Draw the flag scaled to canvas size on an offscreen canvas
  const off = document.createElement('canvas');
  off.width = W;
  off.height = H;
  const oCtx = off.getContext('2d');

  const img = new Image();
  img.src = 'https://flags.fmcdn.net/data/flags/w580/us.png';

  // Same parameters as the CodePen SVG animation
  const frequency = 40;  // pixels per wave cycle — higher = longer, lazier wave
  const amplitude = 7;   // vertical displacement in pixels
  let time = 0;

  function drawFrame() {
    ctx.clearRect(0, 0, W, canvas.height);

    for (let x = 0; x < W; x++) {
      const yOffset = Math.sin((x + time) / frequency) * amplitude;
      ctx.drawImage(off, x, 0, 1, H, x, yOffset + amplitude, 1, H);

      // cos is the slope — positive = surface faces light (highlight), negative = shadow
      const slope = Math.cos((x + time) / frequency);
      const alpha = Math.abs(slope) * 0.18;
      ctx.fillStyle = slope > 0
        ? `rgba(255,255,255,${alpha})`
        : `rgba(0,0,0,${alpha})`;
      ctx.fillRect(x, yOffset + amplitude, 1, H);
    }

    time -= 1; // decrement like the CodePen (wave travels left to right)
    requestAnimationFrame(drawFrame);
  }

  img.onload = () => {
    oCtx.drawImage(img, 0, 0, W, H);
    requestAnimationFrame(drawFrame);
  };
</script>
</body>
</html>
